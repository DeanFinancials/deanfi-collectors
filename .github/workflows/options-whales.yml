name: Options Whale Trades Collection

on:
  schedule:
    - cron: '30 16 * * 1-5'    # ~noon ET (11:30am EST / 12:30pm EDT)
    - cron: '0 2 * * 2-6'     # ~9pm ET (9pm EST / 10pm EDT)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (5 sample tickers only)'
        required: false
        default: false
        type: boolean
      lookback_days:
        description: 'Number of trading days to look back'
        required: false
        default: '5'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_REPO: "${{ github.repository_owner }}/deanfi-data"

permissions:
  contents: read

jobs:
  fetch-options-whales:
    runs-on: ubuntu-latest
    # Slow API scans must not hold the shared data publication lock.
    timeout-minutes: 45

    concurrency:
      group: options-whales-collection
      queue: max
      cancel-in-progress: false
    
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}

    steps:
      - name: Checkout collectors repo
        uses: actions/checkout@v5
      
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test publication retry guard
        run: python -m pytest tests/test_options_publication.py -q
      
      - name: Fetch options whale trades
        run: |
          cd optionswhales
          
          # Build command with optional flags
          CMD="python fetch_options_whales.py"
          
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            CMD="$CMD --test"
            echo "🧪 Running in TEST mode (5 sample tickers)"
          fi
          
          if [ -n "${{ inputs.lookback_days }}" ] && [ "${{ inputs.lookback_days }}" != "5" ]; then
            CMD="$CMD --lookback ${{ inputs.lookback_days }}"
            echo "📅 Using custom lookback: ${{ inputs.lookback_days }} trading days"
          fi
          
          echo "🐋 Starting options whale collection..."
          $CMD
          echo "✅ Options whale collection complete"
      
      - name: Preserve collected outputs
        uses: actions/upload-artifact@v4
        with:
          name: options-whales-${{ github.run_id }}
          path: optionswhales/*.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-options-whales:
    needs: fetch-options-whales
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only the short publication job serializes with other data writers.
    concurrency:
      group: deanfi-data-repo
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout data repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-cache

      - name: Restore collected outputs
        uses: actions/download-artifact@v4
        with:
          name: options-whales-${{ github.run_id }}
          path: optionswhales

      - name: Check snapshot generation time
        id: snapshot
        run: |
          python3 <<'PYTHON'
          import json, os
          from datetime import datetime
          from pathlib import Path

          summary = json.loads(Path('optionswhales/options_whale_summary.json').read_text())
          generated = datetime.fromisoformat(summary['metadata']['generated_at'].replace('Z', '+00:00'))
          if generated.tzinfo is None:
              raise ValueError('Options snapshot timestamp must include a timezone')
          fp = Path('data-cache/data_freshness.json')
          freshness = json.loads(fp.read_text()) if fp.exists() else {}
          previous = freshness.get('sections', {}).get('options-whales', {}).get('last_updated')
          try:
              current = datetime.fromisoformat(previous.replace('Z', '+00:00'))
              publish = generated > current
          except (AttributeError, TypeError, ValueError):
              publish = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"publish={str(publish).lower()}\n")
          print('Publishing newer options snapshot' if publish else 'Keeping newer or equal published snapshot')
          PYTHON

      - name: Copy output to data repo
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          mkdir -p data-cache/options-whales
          cp optionswhales/*.json data-cache/options-whales/
          echo "📦 Output files:"
          ls -la data-cache/options-whales/

      - name: Update data freshness
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          summary = json.loads(Path("optionswhales/options_whale_summary.json").read_text())
          now = summary["metadata"]["generated_at"]
          fp = Path('data-cache/data_freshness.json')
          data = json.loads(fp.read_text()) if fp.exists() else {"sections": {}}

          section_sentinels = {
              "options-whales": "optionswhales/options_whale_summary.json",
          }
          for section, sentinel in section_sentinels.items():
              if Path(sentinel).exists():
                  data["sections"][section] = {"last_updated": now}
                  print(f"  ✅ {section}: {now}")
              else:
                  existing = data.get("sections", {}).get(section, {}).get("last_updated", "never")
                  print(f"  ⏭  {section}: no output, keeping {existing}")

          fp.write_text(json.dumps(data, indent=2))
          print("✅ data_freshness.json written")
          EOF

      - name: Commit and push to data repo
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          cd data-cache
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add options-whales/ data_freshness.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Determine run type for commit message
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              RUN_TYPE="manual"
            else
              HOUR=$(date -u +%H)
              if [ "$HOUR" -ge "15" ] && [ "$HOUR" -le "18" ]; then
                RUN_TYPE="mid-market"
              else
                RUN_TYPE="post-market"
              fi
            fi
            
            git commit -m "🐋 Options whale trades update ($RUN_TYPE) - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
            echo "✅ Changes pushed to data repo"
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "## 🐋 Options Whale Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data-cache/options-whales/options_whale_summary.json" ]; then
            echo "- **Generated**: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
            # Extract stats using jq-style parsing
            TICKERS=$(python3 -c "import json; d=json.load(open('data-cache/options-whales/options_whale_summary.json')); print(d.get('metadata',{}).get('tickers_scanned','N/A'))")
            WHALES=$(python3 -c "import json; d=json.load(open('data-cache/options-whales/options_whale_summary.json')); print(d.get('metadata',{}).get('tickers_with_whales','N/A'))")
            TRADES=$(python3 -c "import json; d=json.load(open('data-cache/options-whales/options_whale_summary.json')); print(d.get('metadata',{}).get('total_whale_trades','N/A'))")
            SWEEPS=$(python3 -c "import json; d=json.load(open('data-cache/options-whales/options_whale_summary.json')); print(d.get('metadata',{}).get('sweeps_detected','N/A'))")
            SENTIMENT=$(python3 -c "import json; d=json.load(open('data-cache/options-whales/options_whale_summary.json')); print(d.get('overall_sentiment',{}).get('direction','N/A'))")
            RATIO=$(python3 -c "import json; d=json.load(open('data-cache/options-whales/options_whale_summary.json')); print(d.get('overall_sentiment',{}).get('call_put_ratio','N/A'))")
            echo "- **Tickers Scanned**: $TICKERS" >> $GITHUB_STEP_SUMMARY
            echo "- **Tickers with Whales**: $WHALES" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Whale Trades**: $TRADES" >> $GITHUB_STEP_SUMMARY
            echo "- **Sweeps Detected**: $SWEEPS" >> $GITHUB_STEP_SUMMARY
            echo "- **Overall Sentiment**: $SENTIMENT" >> $GITHUB_STEP_SUMMARY
            echo "- **Call/Put Ratio**: $RATIO" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Summary file not found" >> $GITHUB_STEP_SUMMARY
          fi
