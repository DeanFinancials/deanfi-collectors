name: Recover queued intraday collection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-intraday.yml']
permissions:
  actions: write
jobs:
  release-old-scan:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Cancel superseded scan only while it is still collecting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/DeanFinancials/deanfi-collectors'
          def api(path, method='GET'):
              request = urllib.request.Request(base + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          replacement = api('/actions/runs/34396525845')
          old = api('/actions/runs/34394446476')
          assert replacement['head_sha'] == '812e9f4f147a5bcab11d108233f83a1c8eaf25b7'
          assert replacement['status'] == 'in_progress' or replacement['conclusion'] == 'success'
          assert old['head_sha'] == '39325524cb9d687fe07cb26aef0930a0695ed05f'
          jobs = api('/actions/runs/34394446476/jobs')['jobs']
          scanning = any(step['name'] == 'Fetch options whale trades' and step['status'] == 'in_progress'
                         for job in jobs for step in job.get('steps', []))
          if old['status'] == 'in_progress' and scanning:
              api('/actions/runs/34394446476/cancel', 'POST')
              print('Cancelled superseded scan; replacement scan remains active.')
          else:
              print('Old scan already advanced or finished; no cancellation needed.')
          PY
