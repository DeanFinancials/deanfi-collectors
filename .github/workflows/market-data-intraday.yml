name: Market Data Collection (15-min)
run-name: Market data (${{ inputs.source || github.event_name }}) ${{ inputs.scheduled_at }}

on:
  schedule:
    - cron: '7,22,37,52 8-21 * * 1-5'  # Early bootstrap and backup; handoffs maintain cadence
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        type: choice
        options: [manual, handoff]
        default: manual
      scheduled_at:
        description: Scheduler event time (UTC)
        type: string
        required: false
      collect_data:
        description: Collect data (handoffs disable this outside market hours)
        type: boolean
        default: true
  # Exercise collector reliability fixes immediately on main.
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-data-intraday.yml'
      - 'advancedecline/**'
      - 'majorindexes/**'
      - 'shared/cache_manager.py'
      - 'shared/yf_retry.py'
      - 'scripts/check_market_collection.py'
      - 'scripts/publish_market_data.py'
      - 'tests/test_market_publication.py'
      - 'scheduler/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DATA_REPO: "${{ github.repository_owner }}/deanfi-data"

permissions:
  contents: read

jobs:
  fetch-and-publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.source != 'handoff' || inputs.collect_data }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    concurrency:
      group: deanfi-data-repo
      queue: max
      cancel-in-progress: false

    steps:
      - name: Checkout collectors repo
        uses: actions/checkout@v5

      - name: Checkout data repo
        uses: actions/checkout@v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-cache

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check market hours and recent publication
        id: hours_check
        run: python scripts/check_market_collection.py

      - name: Test download reliability
        run: python -m pytest tests/test_cache_manager.py tests/test_yf_helpers.py tests/test_market_collection_schedule.py tests/test_market_publication.py -q

      - name: Get cache key
        if: steps.hours_check.outputs.in_market_hours == 'true'
        id: cache_key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore rolling market cache
        if: steps.hours_check.outputs.in_market_hours == 'true'
        uses: actions/cache@v4
        with:
          path: ./cache
          key: market-data-cache-${{ steps.cache_key.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            market-data-cache-${{ steps.cache_key.outputs.date }}-
            market-data-cache-

      - name: Create cache directory
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: mkdir -p ./cache

      - name: Fetch market breadth
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          cd advancedecline
          python fetch_daily_breadth.py --cache-dir ../cache
          python fetch_ad_line_historical.py --cache-dir ../cache
          python fetch_ma_percentage_historical.py --cache-dir ../cache
          python fetch_highs_lows_historical.py --cache-dir ../cache
          python fetch_volume_metrics_historical.py --cache-dir ../cache --sessions 60

      - name: Fetch major indexes
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          cd majorindexes
          python fetch_us_major.py --cache-dir ../cache
          python fetch_sectors.py --cache-dir ../cache
          python fetch_growth_value.py --cache-dir ../cache
          python fetch_international.py --cache-dir ../cache
          python fetch_bonds.py --cache-dir ../cache
          python fetch_commodities.py --cache-dir ../cache

      - name: Fetch mean reversion
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          cd meanreversion
          python fetch_price_vs_ma.py --cache-dir ../cache
          python fetch_ma_spreads.py --cache-dir ../cache

      - name: Fetch implied volatility
        if: steps.hours_check.outputs.in_market_hours == 'true'
        continue-on-error: true
        run: |
          cd impliedvol
          python fetch_vix_options.py || true
          python fetch_major_indices_iv.py || true
          python fetch_sector_etfs_iv.py || true

      - name: Validate core outputs
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json
          from pathlib import Path

          breadth = json.loads(Path('advancedecline/daily_breadth.json').read_text())
          if not breadth.get('data', {}).get('date'):
              raise SystemExit('daily_breadth.json has no trading date')

          majors = json.loads(Path('majorindexes/us_major_indices.json').read_text())
          indices = majors.get('indices') or {}
          if len(indices) < 4:
              raise SystemExit(f'us_major_indices.json only contains {len(indices)} indices')

          print(f"Breadth trading date: {breadth['data']['date']}")
          print(f"Major indices populated: {len(indices)}")
          PY

      - name: Copy files to data repo
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          mkdir -p data-cache/advance-decline data-cache/major-indexes data-cache/meanreversion data-cache/implied-volatility
          cp advancedecline/daily_breadth.json data-cache/advance-decline/
          cp advancedecline/ad_line_historical.json data-cache/advance-decline/
          cp advancedecline/ma_percentage_historical.json data-cache/advance-decline/
          cp advancedecline/highs_lows_historical.json data-cache/advance-decline/
          cp advancedecline/volume_metrics_historical.json data-cache/advance-decline/
          cp majorindexes/*.json data-cache/major-indexes/
          cp meanreversion/*.json data-cache/meanreversion/
          cp impliedvol/*.json data-cache/implied-volatility/ 2>/dev/null || true

      - name: Update data freshness
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          python3 << 'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          fp = Path('data-cache/data_freshness.json')
          data = json.loads(fp.read_text()) if fp.exists() else {'sections': {}}
          for section in ('advance-decline', 'major-indexes', 'meanreversion', 'implied-volatility'):
              data.setdefault('sections', {})[section] = {'last_updated': now}
          fp.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate snapshots
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          cd data-cache
          python ../scripts/validate_snapshots.py

      - name: Commit and push
        if: steps.hours_check.outputs.in_market_hours == 'true'
        run: |
          set -euo pipefail
          cd data-cache
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add advance-decline/ major-indexes/ meanreversion/ implied-volatility/ data_freshness.json

          if git diff --staged --quiet; then
            echo "No market data changes to commit"
            exit 0
          fi

          python ../scripts/publish_market_data.py "chore: update market data (15-min) - $(date -u +'%Y-%m-%d %H:%M UTC')"

  schedule-next:
    name: Schedule next intraday collection
    needs: fetch-and-publish
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && vars.MARKET_INTRADAY_CHAIN_DISABLED != 'true' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    # The data-repository lock belongs only to fetch-and-publish, not this timer.
    concurrency:
      group: market-data-next-run
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scheduler
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test handoff logic
        run: node --test scheduler/next-run.test.mjs
      - name: Wait for next interval and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_INTRADAY_CHAIN_DISABLED: ${{ vars.MARKET_INTRADAY_CHAIN_DISABLED }}
        run: node scheduler/next-run.mjs
