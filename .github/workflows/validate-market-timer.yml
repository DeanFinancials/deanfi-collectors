name: Validate market timer without collection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-market-timer.yml']
permissions:
  actions: write
jobs:
  exercise-timer-only:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Start one timer-only handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          url = 'https://api.github.com/repos/DeanFinancials/deanfi-collectors/actions/workflows/market-data-intraday.yml/dispatches'
          payload = {'ref': 'main', 'inputs': {
              'source': 'handoff', 'collect_data': False,
              'scheduled_at': datetime.now(timezone.utc).isoformat(),
          }}
          request = urllib.request.Request(url, method='POST', data=json.dumps(payload).encode(), headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              assert response.status == 204
          print('Timer-only handoff dispatched.')
          PY
