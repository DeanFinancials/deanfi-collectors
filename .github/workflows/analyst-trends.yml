name: Analyst Trends Collection

on:
  schedule:
    # Weeknights at 10:00pm New York time so trends refresh before the next session.
    # Both UTC hours run (Tue-Sat UTC = Mon-Fri evening ET); the dst-gate job keeps the one that is 10pm today.
    - cron: '0 2 * * 2-6'  # 10:00pm EDT
    - cron: '0 3 * * 2-6'  # 10:00pm EST
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FINNHUB_API_KEY: "${{ secrets.FINNHUB_API_KEY }}"
  DATA_REPO: "${{ github.repository_owner }}/deanfi-data"
  DATA_REPO_TOKEN: "${{ secrets.DATA_REPO_TOKEN }}"

# Pushes to deanfi-data use DATA_REPO_TOKEN; GITHUB_TOKEN only reads this repo.
permissions:
  contents: read

jobs:
  # Cron is UTC, so both the EST and EDT hours are scheduled; this gate lets
  # only the run scheduled for 10pm New York time through. The other run
  # skips the publish job and succeeds without touching deanfi-data.
  dst-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Run only at 10pm New York time
        id: gate
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/ny_hour_gate.py --local-hour 22

  fetch-and-publish:
    needs: dst-gate
    if: needs.dst-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Queue all data collectors to prevent git conflicts when writing to deanfi-data repo
    concurrency:
      group: deanfi-data-repo
      queue: max
      cancel-in-progress: false
    
    steps:
      - name: Checkout collectors repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Checkout data repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-cache
      
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Fetch recommendation trends
        continue-on-error: true
        run: |
          cd analysttrends
          python fetch_recommendation_trends.py
          echo "✅ Recommendation trends fetched"

      - name: Aggregate by sector
        continue-on-error: true
        run: |
          cd analysttrends
          python aggregate_by_sector.py
          echo "✅ Sector aggregation complete"

      - name: Copy to data repo
        run: |
          mkdir -p data-cache/analyst-trends
          cp analysttrends/recommendation_trends.json data-cache/analyst-trends/ 2>/dev/null || true
          cp analysttrends/sector_recommendation_trends.json data-cache/analyst-trends/ 2>/dev/null || true
          echo "✅ Files copied (missing outputs skipped)"

      - name: Update data freshness
        run: |
          python3 << 'EOF'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          fp = Path('data-cache/data_freshness.json')
          data = json.loads(fp.read_text()) if fp.exists() else {"sections": {}}

          section_sentinels = {
              "analyst-trends": "analysttrends/recommendation_trends.json",
          }
          for section, sentinel in section_sentinels.items():
              if Path(sentinel).exists():
                  data["sections"][section] = {"last_updated": now}
                  print(f"  ✅ {section}: {now}")
              else:
                  existing = data.get("sections", {}).get(section, {}).get("last_updated", "never")
                  print(f"  ⏭  {section}: no output, keeping {existing}")

          fp.write_text(json.dumps(data, indent=2))
          print("✅ data_freshness.json written")
          EOF

      - name: Commit and push
        run: |
          cd data-cache
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analyst-trends/ data_freshness.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update analyst trends - $(date -u +"%Y-%m-%d")"
            git pull --rebase origin main
            git push
            echo "✅ Data pushed to repository"
          fi
