name: CI

# Runs the test suites on every push and pull request. Read-only: it never
# checks out or pushes to deanfi-data.
on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# Its own group: CI never publishes, so it must not queue behind deanfi-data-repo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python tests
        run: python3 -m pytest -q

      - name: Daily-news tests
        run: python3 -m pytest -q dailynews/tests

      - name: Scheduler tests
        run: node --test scheduler/next-run.test.mjs
