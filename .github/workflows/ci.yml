name: CI

# Runs the test suites on every push and pull request. Read-only: it never
# checks out or pushes to deanfi-data.
on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# Its own group: CI never publishes, so it must not queue behind deanfi-data-repo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Python tests
        run: python3 -m pytest -q

      - name: Daily-news tests
        run: python3 -m pytest -q dailynews/tests

      - name: Scheduler tests
        run: node --test scheduler/next-run.test.mjs
