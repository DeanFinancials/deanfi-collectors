name: ETF Fund Flows (Daily)

on:
  schedule:
  # Weeknights after US market close: 21:45 UTC is 4:45pm EST / 5:45pm EDT, after the close year-round.
  - cron: '45 21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'test'
        type: choice
        options:
          - test
          - full
      tickers:
        description: 'Comma-separated tickers (optional override)'
        required: false
        default: 'SPY,VOO,XLV,XLE,TLT'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ALPHA_VANTAGE_API_KEY: "${{ secrets.ALPHA_VANTAGE_API_KEY }}"
  DATA_REPO: "${{ github.repository_owner }}/deanfi-data"
  DATA_REPO_TOKEN: "${{ secrets.DATA_REPO_TOKEN }}"
  # Only scheduled runs and manual "full" runs publish. A manual "test" run
  # covers a handful of tickers; publishing it would rebuild that date's
  # aggregates (and tickers_total) from those tickers alone.
  PUBLISH: "${{ github.event_name == 'schedule' || github.event.inputs.mode == 'full' }}"

# Pushes to deanfi-data use DATA_REPO_TOKEN; GITHUB_TOKEN only reads this repo.
permissions:
  contents: read

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: deanfi-data-repo
      queue: max
      cancel-in-progress: false

    steps:
      - name: Checkout collectors repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Checkout data repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-cache

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Flows need the prior session's AUM/NAV. The script upserts into the
      # month files in etffundflows/output/, so seed them from deanfi-data;
      # without this every run starts empty, writes a one-day file with
      # missing_prior_day on every ticker, and overwrites the history.
      - name: Seed existing monthly outputs from data repo
        run: |
          mkdir -p etffundflows/output
          cp data-cache/etf-fund-flows/etf_fund_flows_*.json etffundflows/output/ 2>/dev/null || true
          ls etffundflows/output | tail -8

      # Fails closed: no continue-on-error. The script writes the month files
      # in place over the seeded copies, so a crash part-way can leave a
      # partial file; a failed step skips every publish step below, the job
      # fails, and deanfi-data keeps its last good files. A first run with
      # nothing to seed, or a ticker without a prior point, is not a failure:
      # the script records missing_prior_day and exits 0.
      - name: Generate ETF fund flows
        # Inputs arrive as data through env, never interpolated into the script.
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          TICKERS: ${{ inputs.tickers }}
        run: |
          set -euo pipefail
          cd etffundflows

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "Scheduled run: full universe"
            python fetch_etf_fund_flows.py --config ./config.yml
            exit 0
          fi

          # Manual runs default to test mode unless set to full
          case "${MODE:-test}" in
            full)
              echo "Manual full run"
              python fetch_etf_fund_flows.py --config ./config.yml
              ;;
            test)
              if [ "${#TICKERS}" -gt 500 ] || ! [[ "$TICKERS" =~ ^[A-Za-z0-9.-]+(\ *,\ *[A-Za-z0-9.-]+)*$ ]]; then
                echo "::error::tickers must be a comma-separated list of symbols (letters, digits, '.' and '-')"
                exit 1
              fi
              echo "Manual test run: tickers=$TICKERS"
              python fetch_etf_fund_flows.py --config ./config.yml --tickers "$TICKERS"
              ;;
            *)
              echo "::error::mode must be test or full"
              exit 1
              ;;
          esac

      - name: Upload test-mode outputs as artifact
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: etf-fund-flows-test-output
          path: etffundflows/output/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Copy to data repo
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p data-cache/etf-fund-flows
          cp etffundflows/output/*.json data-cache/etf-fund-flows/ 2>/dev/null || true
          echo "✅ ETF fund flows files copied (missing outputs skipped)"

      - name: Update data freshness
        if: env.PUBLISH == 'true'
        run: |
          python3 << 'EOF'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          fp = Path('data-cache/data_freshness.json')
          data = json.loads(fp.read_text()) if fp.exists() else {"sections": {}}

          # The output dir always holds the seeded month files, so "has files"
          # says nothing; only a change against deanfi-data counts as new data.
          changed = subprocess.run(
              ['git', 'status', '--porcelain', '--', 'etf-fund-flows'],
              cwd='data-cache', capture_output=True, text=True, check=True,
          ).stdout.strip()
          if changed:
              data["sections"]["etf-fund-flows"] = {"last_updated": now}
              print(f"  ✅ etf-fund-flows: {now}")
          else:
              existing = data.get("sections", {}).get("etf-fund-flows", {}).get("last_updated", "never")
              print(f"  ⏭  etf-fund-flows: no new data, keeping {existing}")

          fp.write_text(json.dumps(data, indent=2))
          print("✅ data_freshness.json written")
          EOF

      - name: Commit and push
        if: env.PUBLISH == 'true'
        run: |
          cd data-cache
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add etf-fund-flows/ data_freshness.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ETF fund flows - $(date -u +"%Y-%m-%d")"
            git pull --rebase origin main
            git push
            echo "✅ ETF fund flows pushed to repository"
          fi
