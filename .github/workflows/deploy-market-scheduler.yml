name: Deploy Market Scheduler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/deploy-market-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: deploy-market-scheduler
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Test scheduler
        run: node --test scheduler/worker.test.mjs
      - name: Deploy and verify Cloudflare scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.MARKET_SCHEDULER_GITHUB_TOKEN || secrets.DATA_REPO_TOKEN }}
        run: node scheduler/deploy.mjs
