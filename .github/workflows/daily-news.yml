name: Daily News Collection

on:
  workflow_dispatch:
    inputs:
      weekly_override:
        description: "Force weekly-wrap mode (5 catalysts required)"
        required: false
        default: "false"
      dispatch_combine:
        description: "Also dispatch deanfi-data combine-daily-snapshots (only after the close)"
        type: boolean
        required: false
        default: false
  schedule:
    # Safely after the US market close in both EDT and EST.
    - cron: '30 22 * * 1-5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FINNHUB_API_KEY: "${{ secrets.FINNHUB_API_KEY }}"
  DATA_REPO: "${{ github.repository_owner }}/deanfi-data"
  DATA_REPO_TOKEN: "${{ secrets.DATA_REPO_TOKEN }}"
  MARKET_PULSE_WEEKLY_OVERRIDE: "${{ github.event.inputs.weekly_override || 'false' }}"

# Pushes to deanfi-data use DATA_REPO_TOKEN; GITHUB_TOKEN only reads this repo.
permissions:
  contents: read

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Queue all data collectors to prevent git conflicts when writing to deanfi-data repo
    concurrency:
      group: deanfi-data-repo
      queue: max
      cancel-in-progress: false

    steps:
      - name: Checkout collectors repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-cache

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Resolve market date (ET)
        id: market_date
        run: |
          # Use America/New_York date so weekend triggers (rare) still resolve cleanly.
          MARKET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "value=$MARKET_DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved market_date: $MARKET_DATE"

      - name: Fetch top news
        run: |
          cd dailynews
          python fetch_top_news.py
          echo "Top news fetched"

      - name: Fetch sector news
        run: |
          cd dailynews
          python fetch_sector_news.py
          echo "Sector news fetched"

      - name: Copy news snapshots into data repo
        run: |
          mkdir -p data-cache/daily-news
          cp dailynews/top_news.json data-cache/daily-news/
          cp dailynews/sector_news.json data-cache/daily-news/

      - name: Update daily-news lookback files
        run: |
          python dailynews/update_news_lookback.py --data-repo-path data-cache --lookback-days 7

      - name: Build market_catalysts.json
        run: |
          python dailynews/collect_catalysts.py \
            --top-news data-cache/daily-news/top_news.json \
            --sector-news data-cache/daily-news/sector_news.json \
            --output data-cache/daily-news/market_catalysts.json \
            --market-date "${{ steps.market_date.outputs.value }}"
          echo "market_catalysts.json built"

      - name: Update metadata
        run: |
          cd data-cache
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ -f metadata.json ]; then
            sed -i "s/\"last_updated\": \".*\"/\"last_updated\": \"$TIMESTAMP\"/" metadata.json
          fi

      - name: Commit and push to data repo
        run: |
          cd data-cache
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-news/ metadata.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily news + market_catalysts - $(date -u +"%Y-%m-%d %H:%M UTC")"
            git pull --rebase origin main
            git push
            echo "Data pushed to deanfi-data repository"
          fi

      # Combine's own cron is late by hours and has started only 9-13 minutes after
      # this job, so start it as soon as the catalysts are pushed. Scheduled runs, plus
      # manual runs that opt in with dispatch_combine: a manual mid-day run must not
      # produce a Market Pulse input for a session that has not closed. Combine's cron
      # stays as a fallback. DATA_REPO_TOKEN needs Actions: Read and write on
      # deanfi-data for this.
      - name: Trigger combine-daily-snapshots
        if: github.event_name == 'schedule' || inputs.dispatch_combine
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if gh workflow run combine-daily-snapshots.yml --repo "$DATA_REPO" --ref main; then
            echo "Dispatched $DATA_REPO combine-daily-snapshots.yml" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Combine not dispatched::Combine's scheduled run remains the fallback."
          fi
